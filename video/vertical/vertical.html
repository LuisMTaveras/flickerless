<!doctype html>
<html lang="es"><head><meta charset="utf-8"><title>Flickerless vs Skeleton (vertical)</title>
<script src="timing_v.js"></script>
<style>
:root{--paper:#f2eee4;--ink:#15130e;--mut:#6b6558;--line:#d8d1be;--card:#fffdf7;--red:#d2361e;--grn:#0f7a49;--amb:#f4b400;--grey:#e1dacb}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1080px;height:1920px;overflow:hidden;background:var(--paper);font-family:'Inter Display',Inter,sans-serif;color:var(--ink)}
#root{position:absolute;inset:0}
.abs{position:absolute}.scene{position:absolute;inset:0}
.mono{font-family:'JetBrains Mono',monospace}
.sub{position:absolute;left:60px;right:60px;top:1470px;display:flex;justify-content:center}
.sub div{background:var(--ink);color:#f2eee4;font-size:58px;font-weight:800;line-height:1.2;padding:18px 36px;border-radius:10px;text-align:center;letter-spacing:-.01em}
.sub r{color:#ff8f78}.sub g{color:#62d9a0}
.sub mark{background:var(--amb);color:var(--ink);padding:0 10px;border-radius:4px}
.brand{position:absolute;left:0;right:0;top:130px;text-align:center;font-size:30px;font-weight:800;letter-spacing:.14em;color:var(--mut)}
.lab{position:absolute;display:flex;align-items:center;gap:14px;font-size:40px;font-weight:900;letter-spacing:.04em}
.lab i{width:26px;height:26px;display:block}
.app{position:absolute;width:840px;background:var(--card);border:2px solid var(--ink);border-radius:10px;padding:24px 28px;overflow:hidden;transform:scale(.8);transform-origin:0 0}
.app.r{box-shadow:12px 12px 0 var(--red)}.app.g{box-shadow:12px 12px 0 var(--grn)}
.hd{display:flex;justify-content:space-between;align-items:center;height:44px}
.hd h3{font-size:32px;font-weight:800}
.chip{font-size:24px;font-weight:600;padding:6px 18px;border-radius:6px;background:var(--paper);border:2px solid var(--ink)}
.kpi{margin-top:14px;height:98px;border-radius:8px;background:var(--paper);border:1px solid var(--line);padding:12px 22px}
.kpi small{display:block;font-size:20px;color:var(--mut);height:26px;font-weight:500}
.kpi .v{font-size:44px;font-weight:800;height:48px;display:flex;align-items:center;font-variant-numeric:tabular-nums}
.tw{position:relative;margin-top:14px;overflow:hidden}
.th,.tr{display:flex;height:64px;align-items:center;font-size:27px;border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums}
.th{height:52px;font-size:19px;color:var(--mut);font-weight:700;letter-spacing:.06em}
.c1{width:150px}.c2{width:290px}.c3{width:170px}.c4{width:200px;text-align:right}
.tr .c4{font-weight:700}
.gb{height:22px;border-radius:5px;background:var(--grey)}
.dash{color:var(--mut)}
.ft{height:44px;font-size:22px;color:var(--mut);display:flex;align-items:center}
.bar{position:absolute;left:0;right:0;top:0;height:4px;background:var(--line);z-index:3}
.bar i{position:absolute;top:0;bottom:0;width:30%;background:var(--grn)}
.cursor{position:absolute;width:46px;height:46px;z-index:9}
.ripple{position:absolute;border:4px solid var(--ink);border-radius:50%;z-index:8}
.call{position:absolute;padding:10px 20px;border-radius:6px;font-size:32px;font-weight:800;z-index:10;white-space:nowrap}
.call.r{background:var(--red);color:#fff}.call.g{background:var(--grn);color:#fff}
.tag{display:inline-block;font-weight:700;padding:8px 26px;border-radius:6px;background:var(--grn);color:#fff;font-size:36px}
</style></head>
<body><div id="root"></div>
<script>
const $=(s)=>document.getElementById(s);
const clamp=(x,a=0,b=1)=>Math.min(b,Math.max(a,x));
const ease=(x)=>{x=clamp(x);return x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2};
const fade=(lt,d,i=.4,o=.4)=>clamp(Math.min(lt/i,(d-lt)/o));
const money=(n)=>'$'+n.toLocaleString('en-US',{minimumFractionDigits:2});
const TM=window.TIMING;
const DATA={
  A:{filter:'Este mes',total:48250,rows:[['F-1042','Acme S.A.','12 mar',4820],['F-1041','Nova Corp','11 mar',12300],['F-1040','Orbita SRL','09 mar',7415.5],['F-1039','Delta Group','08 mar',23714.5]]},
  B:{filter:'Mes anterior',total:31980,rows:[['F-1031','Helio Ltd','28 feb',9100],['F-1030','Acme S.A.','25 feb',15640],['F-1029','Zeta Labs','21 feb',7240]]}
};
const ROWH=64, SC=.8, CX=(1080-840*SC)/2, SKY=310, FLY=910;

function appHTML(vm){
  const d=DATA[vm.ds||'A'], op=vm.pulse!==undefined?vm.pulse:1;
  let kpi=vm.kpi==='grey'?`<div class="gb" style="width:200px;height:30px;opacity:${op}"></div>`:(vm.kpi===null?`<span class="dash">—</span>`:vm.kpi);
  let rows='';
  if(vm.mode==='real') rows=d.rows.map(r=>`<div class="tr"><div class="c1">${r[0]}</div><div class="c2">${r[1]}</div><div class="c3">${r[2]}</div><div class="c4">${money(r[3])}</div></div>`).join('');
  else if(vm.mode==='skel') for(let i=0;i<vm.nSkel;i++) rows+=`<div class="tr"><div class="c1"><div class="gb" style="width:90px;opacity:${op}"></div></div><div class="c2"><div class="gb" style="width:190px;opacity:${op}"></div></div><div class="c3"><div class="gb" style="width:100px;opacity:${op}"></div></div><div class="c4"><div class="gb" style="width:120px;margin-left:auto;opacity:${op}"></div></div></div>`;
  else for(let i=0;i<vm.nShell;i++) rows+=`<div class="tr dash"><div class="c1">—</div><div class="c2">—</div><div class="c3">—</div><div class="c4">—</div></div>`;
  const minH=vm.minRows?`min-height:${vm.minRows*ROWH}px;`:'';
  const bar=vm.bar!=null?`<div class="bar"><i style="left:${-30+vm.bar*130}%"></i></div>`:'';
  const ft=vm.footer==='grey'?`<div class="gb" style="width:160px;height:16px;opacity:${op}"></div>`:vm.footer;
  return `<div class="app ${vm.cls}" style="left:${CX}px;top:${vm.y}px">
   <div class="hd"><h3>Facturación</h3><div class="chip">${vm.filter} ▾</div></div>
   <div class="kpi"><small>Total facturado</small><div class="v">${kpi}</div></div>
   <div class="tw" style="${minH}">${bar}
    <div class="th"><div class="c1">N.º</div><div class="c2">CLIENTE</div><div class="c3">FECHA</div><div class="c4">TOTAL</div></div>
    <div style="opacity:${vm.dim!==undefined?vm.dim:1}">${rows}</div></div>
   <div class="ft">${ft}</div></div>`;
}
// absolute y of the footer line of a card whose top is y and has n rows
const footAbs=(y,n)=>y+SC*(248+n*ROWH);
function labels(){return `<div class="lab" style="left:${CX}px;top:${SKY-62}px;color:var(--red)"><i style="background:var(--red)"></i>SKELETON</div><div class="lab" style="left:${CX}px;top:${FLY-62}px;color:var(--grn)"><i style="background:var(--grn)"></i>FLICKERLESS</div>`}
const brand=`<div class="brand">FLICKERLESS vs SKELETON</div>`;
function cursors(lt,tc){
  let out=''; const a=ease((lt-(tc-.9))/.8), p=(lt-tc)/.5;
  const o=clamp((lt-(tc-.9))/.2)*clamp((tc+1.2-lt)/.3);
  for(const Y of [SKY,FLY]){
    const cx=CX+742*SC, cy=Y+46*SC, sx=cx-60, sy=cy+170;
    const x=sx+(cx-sx)*a, y=sy+(cy-sy)*a;
    let rip=''; if(p>0&&p<1){const r=10+p*50;rip=`<div class="ripple" style="left:${cx-r}px;top:${cy-r}px;width:${2*r}px;height:${2*r}px;opacity:${1-p}"></div>`}
    out+=`<div style="opacity:${o}"><svg class="cursor" style="left:${x}px;top:${y}px" viewBox="0 0 24 24"><path d="M3 2l7 19 3-8 8-3z" fill="#fff" stroke="#15130e" stroke-width="1.8"/></svg>${rip}</div>`;
  }
  return out;
}
function sub(lt,sc){
  for(const g of sc.segs){ if(lt>=g.a-.1&&lt<g.b+.5){
    let ch=g.chunks[g.chunks.length-1]; for(const c of g.chunks){ if(lt<c.b){ch=c;break;} }
    const o=clamp(Math.min((lt-g.a+.1)/.15,(g.b+.5-lt)/.3));
    return `<div class="sub" style="opacity:${o}"><div>${ch.t}</div></div>`; } }
  return '';
}

function sHook(lt,sc){
  const o=fade(lt,sc.d,.3,.4);
  const showSkel=Math.floor(lt/.42)%2===1;
  const nR=DATA.A.rows.length;
  const vm=showSkel?{cls:'r',y:760,filter:'Este mes',ds:'A',mode:'skel',nSkel:5,kpi:'grey',footer:'grey',pulse:1}:{cls:'r',y:760,filter:'Este mes',ds:'A',mode:'real',kpi:money(48250),footer:`Mostrando ${nR} de ${nR}`};
  const a=ease(lt/.5);
  return `<div class="scene" style="opacity:${o}">
   <div class="abs" style="left:60px;right:60px;top:240px;text-align:center;font-size:132px;font-weight:900;letter-spacing:-.04em;line-height:1.02;opacity:${a}">¿Tu tabla<br><span style="color:var(--red)">parpadea?</span></div>
   ${appHTML(vm)}${sub(lt,sc)}</div>`;
}

function sReload(lt,sc){
  const o=fade(lt,sc.d,.4,.4), S=sc.segs;
  const click=S[0].b-.2, req=click+.4, resp=S[2].a+.1;
  const loading=lt>=req&&lt<resp, ds=lt<resp?'A':'B';
  const filter=lt<click+.1?DATA.A.filter:DATA.B.filter;
  const pulse=.55+.45*Math.sin(lt*8), nR=DATA[ds].rows.length;
  const SK={cls:'r',y:SKY,filter,ds,mode:loading?'skel':'real',nSkel:5,kpi:loading?'grey':money(DATA[ds].total),footer:loading?'grey':`Mostrando ${nR} de ${nR}`,pulse};
  const dimmed=loading&&lt>=req+.18;
  const FL={cls:'g',y:FLY,filter,ds,mode:'real',kpi:money(DATA[ds].total),footer:`Mostrando ${nR} de ${nR}`,dim:dimmed?.4:1,bar:dimmed?((lt-req-.18)*.55)%1:null,minRows:4};
  let calls='';
  if(lt>=req&&lt<req+2) calls+=`<div class="call r" style="left:${CX+330}px;top:${footAbs(SKY,5)+8}px;opacity:${clamp((lt-req)*3)*clamp((req+2-lt)*3)}">▼ cambia de tamaño</div>`;
  if(lt>=resp&&lt<resp+2) calls+=`<div class="call r" style="left:${CX+330}px;top:${footAbs(SKY,nR)+8}px;opacity:${clamp((lt-resp)*3)*clamp((resp+2-lt)*3)}">▲ y otra vez</div>`;
  if(lt>=resp+.3&&lt<resp+2.4) calls+=`<div class="call g" style="left:${CX+330}px;top:${footAbs(FLY,4)+8}px;opacity:${clamp((lt-resp-.3)*3)*clamp((resp+2.4-lt)*3)}">sin movimiento</div>`;
  return `<div class="scene" style="opacity:${o}">${brand}${labels()}${appHTML(SK)}${appHTML(FL)}${cursors(lt,click)}${calls}${sub(lt,sc)}</div>`;
}

function sFast(lt,sc){
  const o=fade(lt,sc.d,.4,.4), S=sc.segs;
  const click=S[1].a+.1, req=S[1].a+1.4, resp=req+.6;
  const loading=lt>=req&&lt<resp, ds=lt<resp?'A':'B';
  const filter=lt<click+.1?DATA.A.filter:DATA.B.filter;
  const pulse=.7+.3*Math.sin(lt*10), nR=DATA[ds].rows.length;
  const SK={cls:'r',y:SKY,filter,ds,mode:loading?'skel':'real',nSkel:5,kpi:loading?'grey':money(DATA[ds].total),footer:loading?'grey':`Mostrando ${nR} de ${nR}`,pulse};
  const FL={cls:'g',y:FLY,filter,ds,mode:'real',kpi:money(DATA[ds].total),footer:`Mostrando ${nR} de ${nR}`,minRows:4};
  const ms=lt<req?0:clamp((lt-req)*250,0,300);
  const x0=150,w=780,px=(m)=>x0+w*m/300, sy=1400;
  const sa=clamp((lt-S[0].a)*2);
  const pulseT=lt>S[2].a?1+.15*Math.sin((lt-S[2].a)*6):1;
  const strip=`<div class="abs" style="left:0;right:0;top:${sy}px;opacity:${sa}">
   <div class="abs" style="left:${x0}px;top:22px;width:${w}px;height:8px;background:var(--line)"></div>
   <div class="abs" style="left:${x0}px;top:22px;width:${w*ms/300}px;height:8px;background:var(--ink)"></div>
   <div class="abs" style="left:${px(150)-3}px;top:6px;width:6px;height:40px;background:var(--red)"></div>
   <div class="abs" style="left:${px(150)-170}px;top:-26px;width:170px;text-align:right;font-size:26px;font-weight:800;color:var(--red)">150 ms</div>
   <div class="abs" style="left:${px(180)-3}px;top:6px;width:6px;height:40px;background:var(--grn);transform:scaleY(${pulseT})"></div>
   <div class="abs" style="left:${px(180)+10}px;top:-26px;white-space:nowrap;font-size:26px;font-weight:800;color:var(--grn)">umbral 180 ms</div>
   <div class="abs" style="left:${x0+w*ms/300-11}px;top:13px;width:22px;height:22px;border-radius:50%;background:var(--ink)"></div></div>`;
  const slowO=clamp((lt-S[1].a)*3)*clamp((S[2].a+1-lt)*3);
  const slow=`<div class="abs" style="left:290px;width:500px;top:172px;text-align:center;font-size:30px;font-weight:800;letter-spacing:.08em;background:var(--ink);color:var(--paper);padding:10px 0;border-radius:6px;opacity:${slowO}">CÁMARA LENTA ×4</div>`;
  return `<div class="scene" style="opacity:${o}">${brand}${slow}${labels()}${appHTML(SK)}${appHTML(FL)}${cursors(lt,click)}${strip}${sub(lt,sc)}</div>`;
}

function sCold(lt,sc){
  const o=fade(lt,sc.d,.4,.4), S=sc.segs;
  const arrive=S[1].b+.7, waiting=lt<arrive;
  const pulse=.55+.45*Math.sin(lt*8);
  const SK=waiting?{cls:'r',y:SKY,filter:'Este mes',ds:'A',mode:'skel',nSkel:5,kpi:money(0),footer:'0 registros',pulse}
                  :{cls:'r',y:SKY,filter:'Este mes',ds:'A',mode:'real',kpi:money(DATA.A.total),footer:'Mostrando 4 de 4'};
  const FL=waiting?{cls:'g',y:FLY,filter:'Este mes',ds:'A',mode:'shell',nShell:4,kpi:null,footer:'—'}
                  :{cls:'g',y:FLY,filter:'Este mes',ds:'A',mode:'real',kpi:money(DATA.A.total),footer:'Mostrando 4 de 4',minRows:4};
  const a=clamp((lt-S[1].a-.3)*2)*clamp((arrive-.3-lt)*2);
  const calls=`<div class="call r" style="left:${CX+300*SC+40}px;top:${SKY+112*SC}px;opacity:${a}">← cifra falsa</div>
   <div class="call g" style="left:${CX+300*SC+40}px;top:${FLY+112*SC}px;opacity:${a}">← aún no se sabe</div>`;
  return `<div class="scene" style="opacity:${o}">${brand}${labels()}${appHTML(SK)}${appHTML(FL)}${calls}${sub(lt,sc)}</div>`;
}

function sMeasured(lt,sc){
  const o=fade(lt,sc.d,.4,.4), S=sc.segs;
  const x0=130, W=760, X=(v)=>x0+W*v/0.1;
  const rows=[
    {g:'Recargas',y:360,bars:[['Skeleton',0.006,'var(--red)'],['Flickerless',0.000,'var(--grn)']],t:S[0].a+1.2},
    {g:'Primera carga',y:760,bars:[['Skeleton',0.006,'var(--red)'],['Flickerless',0.0145,'var(--grn)']],t:S[1].a}];
  let h='';
  rows.forEach(r=>{
    const a=ease((lt-r.t+.2)/.5);
    h+=`<div class="abs" style="left:${x0}px;top:${r.y-62}px;font-size:46px;font-weight:900;opacity:${a}">${r.g}</div>`;
    r.bars.forEach((b,i)=>{
      const g=ease((lt-r.t-.2-i*.4)/.9), val=b[1]*g, bw=Math.max(6,X(val)-x0), yy=r.y+i*110;
      h+=`<div class="abs" style="left:${x0}px;top:${yy}px;height:70px;width:${bw}px;background:${b[2]};opacity:${a}"></div>
       <div class="abs mono" style="left:${x0+bw+16}px;top:${yy+8}px;font-size:44px;font-weight:700;opacity:${a*g};color:${b[2]}">${b[1].toFixed(3)}</div>
       <div class="abs" style="left:${x0}px;top:${yy+74}px;font-size:26px;font-weight:700;color:var(--mut);opacity:${a*g}">${b[0]}</div>`;
    });
  });
  const ta=ease((lt-S[1].a-2)/.6);
  return `<div class="scene" style="opacity:${o}">
   <div class="abs" style="left:${x0}px;top:140px;font-size:78px;font-weight:900;letter-spacing:-.03em;line-height:1">CLS medido</div>
   <div class="abs mono" style="left:${x0}px;top:232px;font-size:24px;color:var(--mut)">Playwright · menos es mejor</div>
   <div class="abs" style="left:${x0}px;top:300px;width:2px;height:960px;background:var(--ink)"></div>
   <div class="abs" style="left:${X(.1)}px;top:300px;height:960px;border-left:4px dashed var(--grn);opacity:${ta}"></div>
   <div class="abs" style="left:${X(.1)-290}px;top:1270px;width:300px;text-align:right;font-size:28px;font-weight:800;color:var(--grn);opacity:${ta}">0.1 · umbral «bueno»</div>
   ${h}${sub(lt,sc)}</div>`;
}

function sOutro(lt,sc){
  const o=fade(lt,sc.d,.4,.6), S=sc.segs;
  const t=ease((lt-.1)/.6), z=ease((lt-.9)/.6), y=ease((lt-1.6)/.6);
  const cards=['FlickerlessSurface','FlickerlessValue','FlickerlessTableShell'].map((c,i)=>{const a=ease((lt-1.2-i*.35)/.5);return `<div class="mono" style="font-size:34px;font-weight:700;color:var(--grn);background:var(--card);border:2px solid var(--ink);box-shadow:8px 8px 0 var(--grn);border-radius:8px;padding:14px 26px;margin:22px auto;width:fit-content;opacity:${a}">${c}</div>`}).join('');
  return `<div class="scene" style="opacity:${o}">
   <div class="abs" style="left:0;right:0;top:300px;text-align:center;opacity:${t};transform:translateY(${(1-t)*20}px)"><div style="font-size:150px;font-weight:900;letter-spacing:-.05em;color:var(--grn);line-height:1">Flickerless</div>
   <div style="font-size:44px;font-weight:600;margin-top:26px;line-height:1.25;padding:0 70px">Lo que ya estaba <span style="background:var(--amb);padding:0 10px;border-radius:4px">se queda</span>.<br>Lo que aún no existe es <span style="background:var(--amb);padding:0 10px;border-radius:4px">“—”</span>.</div></div>
   <div class="abs" style="left:0;right:0;top:760px;text-align:center;opacity:${z}"><div style="display:inline-flex;gap:14px"><span class="tag">Vue 3</span><span class="tag">React</span><span class="tag">React Native</span></div></div>
   <div class="abs" style="left:0;right:0;top:900px;text-align:center">${cards}</div>
   <div class="abs" style="left:0;right:0;top:1290px;text-align:center;font-size:46px;font-weight:900;opacity:${y}">Código abierto · link en la bio</div>
   ${sub(lt,sc)}</div>`;
}

const FN={hook:sHook,reload:sReload,fast:sFast,cold:sCold,measured:sMeasured,outro:sOutro};
window.TOTAL=TM.total;
window.render=function(t){
  t=clamp(t,0,TM.total-1e-6); let h='';
  for(const s of TM.scenes){ if(t>=s.t0&&t<s.t0+s.d){ h=FN[s.id](t-s.t0,s); break; } }
  $('root').innerHTML=h;
};
render(0);
</script></body></html>
