<!doctype html>
<html lang="es"><head><meta charset="utf-8"><title>Flickerless vs Skeleton</title>
<style>
:root{--bg:#0b1020;--panel:#131a2e;--line:#243050;--txt:#e8ecf8;--mut:#8b97b8;--red:#ff5d6c;--grn:#2fd18b;--grey:#2a3553;--acc:#7c9cff}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1920px;height:1080px;overflow:hidden;background:var(--bg);font-family:Inter,'DejaVu Sans',sans-serif;color:var(--txt)}
#root{position:absolute;inset:0}
.abs{position:absolute}
.scene{position:absolute;inset:0}
.cap{position:absolute;left:120px;right:120px;bottom:44px;text-align:center;font-size:44px;font-weight:600;line-height:1.25;letter-spacing:-.01em}
.cap b{color:var(--acc)} .cap .r{color:var(--red)} .cap .g{color:var(--grn)}
.pill{position:absolute;top:96px;height:54px;padding:0 26px;border-radius:30px;font-weight:800;font-size:28px;letter-spacing:.06em;display:flex;align-items:center;gap:12px}
.pill.r{background:rgba(255,93,108,.14);color:var(--red);border:2px solid rgba(255,93,108,.5)}
.pill.g{background:rgba(47,209,139,.14);color:var(--grn);border:2px solid rgba(47,209,139,.5)}
.cls{position:absolute;top:96px;height:54px;display:flex;align-items:center;gap:12px;font-size:28px;font-weight:700;color:var(--mut)}
.cls span{font-variant-numeric:tabular-nums;font-size:34px;font-weight:800;padding:2px 14px;border-radius:10px}
.cls .bad{color:var(--red);background:rgba(255,93,108,.14)} .cls .ok{color:var(--grn);background:rgba(47,209,139,.14)}
.app{position:absolute;top:190px;width:860px;background:var(--panel);border:2px solid var(--line);border-radius:22px;padding:24px 28px;overflow:hidden}
.app.r{border-color:rgba(255,93,108,.35)} .app.g{border-color:rgba(47,209,139,.35)}
.hd{display:flex;justify-content:space-between;align-items:center;height:44px}
.hd h3{font-size:32px;font-weight:700}
.chip{font-size:24px;font-weight:600;padding:6px 18px;border-radius:20px;background:#1d2745;border:2px solid var(--line);position:relative}
.kpi{margin-top:14px;height:98px;border-radius:14px;background:#0f1628;border:1px solid var(--line);padding:12px 22px}
.kpi small{display:block;font-size:20px;color:var(--mut);height:26px}
.kpi .v{font-size:44px;font-weight:800;height:48px;display:flex;align-items:center;font-variant-numeric:tabular-nums}
.tw{position:relative;margin-top:14px;overflow:hidden}
.th,.tr{display:flex;height:64px;align-items:center;font-size:27px;border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums}
.th{height:52px;font-size:19px;color:var(--mut);font-weight:700;letter-spacing:.06em}
.c1{width:150px}.c2{width:290px}.c3{width:170px}.c4{width:200px;text-align:right}
.tr .c4{font-weight:700}
.gb{height:22px;border-radius:7px;background:var(--grey)}
.dash{color:var(--mut);opacity:.7}
.ft{height:44px;font-size:22px;color:var(--mut);display:flex;align-items:center}
.bar{position:absolute;left:0;right:0;top:0;height:3px;background:rgba(124,156,255,.15);z-index:3}
.bar i{position:absolute;top:0;bottom:0;width:30%;background:var(--acc);border-radius:2px}
.cursor{position:absolute;width:34px;height:34px;z-index:9}
.ripple{position:absolute;border:3px solid var(--acc);border-radius:50%;z-index:8}
.call{position:absolute;padding:10px 20px;border-radius:12px;font-size:26px;font-weight:700;z-index:10}
.call.r{background:var(--red);color:#fff}.call.g{background:var(--grn);color:#06241a}
.shift{position:absolute;z-index:10;font-weight:800;color:var(--red);font-size:26px}
.tag{display:inline-block;font-size:20px;font-weight:700;padding:4px 14px;border-radius:10px}
.tag.r{background:rgba(255,93,108,.16);color:var(--red)}.tag.g{background:rgba(47,209,139,.16);color:var(--grn)}
.file{position:absolute;width:390px;height:104px;border-radius:14px;background:#0f1628;border:2px solid var(--line);padding:16px 20px;font-size:30px;font-weight:700}
.file small{display:block;font-size:21px;color:var(--mut);font-weight:500;margin-top:4px}
.mt{display:flex;height:62px;align-items:center;border-bottom:1px solid var(--line);font-size:27px}
.mc{width:150px;padding:0 6px}
.score{position:absolute;left:150px;right:150px;top:150px}
.sr{display:flex;align-items:center;height:118px;border-bottom:1px solid var(--line)}
.sr .lb{width:430px;font-size:34px;font-weight:700}
.sr .a,.sr .b{width:600px;font-size:28px;display:flex;align-items:center;gap:18px;color:var(--mut)}
.ic{width:46px;height:46px;border-radius:50%;flex:none;position:relative}
.ic.x{background:rgba(255,93,108,.18)}.ic.k{background:rgba(47,209,139,.2)}
.ic.x:before,.ic.x:after{content:"";position:absolute;left:12px;top:21px;width:22px;height:4px;border-radius:2px;background:var(--red)}
.ic.x:before{transform:rotate(45deg)}.ic.x:after{transform:rotate(-45deg)}
.ic.k:before{content:"";position:absolute;left:15px;top:9px;width:10px;height:21px;border:solid var(--grn);border-width:0 5px 5px 0;transform:rotate(45deg)}
</style></head>
<body><div id="root"></div>
<script>
const $ = (s)=>document.getElementById(s);
const clamp=(x,a=0,b=1)=>Math.min(b,Math.max(a,x));
const ease=(x)=>{x=clamp(x);return x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2};
const fade=(lt,d,i=.5,o=.5)=>clamp(Math.min(lt/i,(d-lt)/o));
const money=(n)=>'$'+n.toLocaleString('en-US',{minimumFractionDigits:2});

const DATA={
  A:{filter:'Este mes',total:48250,rows:[['F-1042','Acme S.A.','12 mar',4820],['F-1041','Nova Corp','11 mar',12300],['F-1040','Orbita SRL','09 mar',7415.5],['F-1039','Delta Group','08 mar',23714.5]]},
  B:{filter:'Mes anterior',total:31980,rows:[['F-1031','Helio Ltd','28 feb',9100],['F-1030','Acme S.A.','25 feb',15640],['F-1029','Zeta Labs','21 feb',7240]]}
};
const ROWH=64;

// ---- mini app ---------------------------------------------------------------
// vm: {x, cls:'r'|'g', filter, kpi:(string|null|'grey'), mode:'real'|'skel'|'shell', ds, nSkel, minRows, dim, bar, pulse, footer, clsVal, callout}
function appHTML(vm){
  const d=DATA[vm.ds||'A'];
  const op=vm.pulse!==undefined?vm.pulse:1;
  let kpi;
  if(vm.kpi==='grey') kpi=`<div class="gb" style="width:200px;height:30px;opacity:${op}"></div>`;
  else if(vm.kpi===null) kpi=`<span class="dash">—</span>`;
  else kpi=vm.kpi;
  let rows='';
  if(vm.mode==='real'){
    rows=d.rows.map(r=>`<div class="tr"><div class="c1">${r[0]}</div><div class="c2">${r[1]}</div><div class="c3">${r[2]}</div><div class="c4">${money(r[3])}</div></div>`).join('');
  } else if(vm.mode==='skel'){
    for(let i=0;i<vm.nSkel;i++) rows+=`<div class="tr"><div class="c1"><div class="gb" style="width:90px;opacity:${op}"></div></div><div class="c2"><div class="gb" style="width:190px;opacity:${op}"></div></div><div class="c3"><div class="gb" style="width:100px;opacity:${op}"></div></div><div class="c4"><div class="gb" style="width:120px;margin-left:auto;opacity:${op}"></div></div></div>`;
  } else if(vm.mode==='shell'){
    for(let i=0;i<vm.nShell;i++) rows+=`<div class="tr dash"><div class="c1">—</div><div class="c2">—</div><div class="c3">—</div><div class="c4">—</div></div>`;
  }
  const minH=vm.minRows?`min-height:${vm.minRows*ROWH}px;`:'';
  const bar=vm.bar!==undefined&&vm.bar!==null?`<div class="bar"><i style="left:${-30+vm.bar*130}%"></i></div>`:'';
  const dim=vm.dim!==undefined?vm.dim:1;
  const ft=vm.footer==='grey'?`<div class="gb" style="width:160px;height:16px;opacity:${op}"></div>`:vm.footer;
  return `<div class="app ${vm.cls}" style="left:${vm.x}px">
    <div class="hd"><h3>Facturación</h3><div class="chip">${vm.filter} ▾</div></div>
    <div class="kpi"><small>Total facturado</small><div class="v">${kpi}</div></div>
    <div class="tw" style="${minH}">${bar}
      <div class="th"><div class="c1">N.º</div><div class="c2">CLIENTE</div><div class="c3">FECHA</div><div class="c4">TOTAL</div></div>
      <div style="opacity:${dim}">${rows}</div>
    </div>
    <div class="ft">${ft}</div></div>`;
}
const XL=70, XR=990;
function pills(clsL,clsR){
  const f=(v)=>v.toFixed(2);
  return `<div class="pill r" style="left:${XL}px">SKELETON</div>
  <div class="cls" style="left:${XL+330}px">CLS <span class="${clsL>0.1?'bad':'ok'}">${f(clsL)}</span></div>
  <div class="pill g" style="left:${XR}px">FLICKERLESS</div>
  <div class="cls" style="left:${XR+430}px">CLS <span class="ok">${f(clsR)}</span></div>`;
}
function cursor(x,y,t){ // t: 0..1 click progress ring
  return `<svg class="cursor" style="left:${x}px;top:${y}px" viewBox="0 0 24 24"><path d="M3 2l7 19 3-8 8-3z" fill="#fff" stroke="#000" stroke-width="1.5"/></svg>`;
}
function ripple(x,y,p){ if(p<=0||p>=1) return ''; const r=10+p*50; return `<div class="ripple" style="left:${x-r}px;top:${y-r}px;width:${2*r}px;height:${2*r}px;opacity:${1-p}"></div>`;}
// chip position inside each panel (absolute): panel left + 28 + width...
function chipPos(x){return {x:x+860-28-70, y:170+24+20}}
function clickAnim(lt,tc){ // tc: click time; returns {p:ripple progress, cx:cursor offset}
  const a=ease((lt-(tc-.9))/.8); return {a, p:(lt-tc)/.5};
}
function cursors(lt,tc){
  let out='';
  for(const X of [XL,XR]){
    const c=chipPos(X);
    const a=clickAnim(lt,tc).a; const sx=c.x+160, sy=c.y+200;
    const x=sx+(c.x-sx)*a, y=sy+(c.y-sy)*a;
    const o=clamp((lt-(tc-.9))/.2)*clamp((tc+1.2-lt)/.3);
    out+=`<div style="opacity:${o}">${cursor(x,y)}${ripple(c.x,c.y,clickAnim(lt,tc).p)}</div>`;
  }
  return out;
}

// ---- scenes ------------------------------------------------------------------
const S=[
 {id:'title',d:5.5},{id:'reload',d:15},{id:'fast',d:9.5},{id:'cold',d:10},{id:'maint',d:10},{id:'score',d:9},{id:'outro',d:7}
];
let tot=0; for(const s of S){s.t0=tot; tot+=s.d;} const TOTAL=tot;

function cap(html,o=1){return `<div class="cap" style="opacity:${o}">${html}</div>`}
function capSeq(lt,list){ // list of [from,to,html]
  for(const [a,b,h] of list) if(lt>=a&&lt<b) return cap(h,clamp(Math.min((lt-a)/.35,(b-lt)/.35)));
  return '';
}

function sTitle(lt,d){
  const o=fade(lt,d,.6,.6);
  const pulse=.5+.5*Math.sin(lt*5);
  const sk=[0,1,2].map(i=>`<div class="gb" style="width:${360-i*60}px;height:26px;margin:14px 0;opacity:${.4+.6*pulse*(i%2?1:.7)}"></div>`).join('');
  const t1=ease(lt/1.0), t2=ease((lt-1.2)/1.0), t3=ease((lt-2.4)/.8);
  return `<div class="scene" style="opacity:${o}">
    <div class="abs" style="left:0;right:0;top:300px;text-align:center">
      <div style="font-size:132px;font-weight:900;letter-spacing:-.04em;opacity:${t1};transform:translateY(${(1-t1)*30}px)"><span style="color:var(--grn)">Flickerless</span></div>
      <div style="font-size:70px;font-weight:700;color:var(--mut);margin:6px 0;opacity:${t2}">vs</div>
      <div style="font-size:132px;font-weight:900;letter-spacing:-.04em;color:var(--red);opacity:${t2};transform:translateY(${(1-t2)*30}px)">Skeleton</div>
      <div style="font-size:46px;font-weight:600;margin-top:60px;opacity:${t3}">Por qué tus datos <b style="color:var(--acc)">no deberían parpadear</b></div>
    </div></div>`;
}

// ---- reload scene --------------------------------------------------------------
// cycle timeline (u in s): click 0.9 · request 1.2 · response 3.6 (slow, 2.4 s) · settle by 4.4
function reloadVM(kind,u,from,to,clsBase){
  const resp=3.6, req=1.2;
  const loading=u>=req&&u<resp;
  const ds=u<resp?from:to;
  const filter=u<1.0?DATA[from].filter:DATA[to].filter;
  const pulse=.55+.45*Math.sin(u*8);
  const nFrom=DATA[from].rows.length, nTo=DATA[to].rows.length;
  if(kind==='skel'){
    return {vm:{x:XL,cls:'r',filter,ds,mode:loading?'skel':'real',nSkel:nFrom+1,kpi:loading?'grey':money(DATA[ds].total),footer:loading?'grey':`Mostrando ${DATA[ds].rows.length} de ${DATA[ds].rows.length}`,pulse},
      cls:clsBase+(u>=req?.18:0)+(u>=resp?.14:0)};
  }
  const delay=.18;
  const dimmed=loading&&u>=req+delay;
  const bar=dimmed?((u-req-delay)*.55)%1:null;
  return {vm:{x:XR,cls:'g',filter,ds,mode:'real',kpi:money(DATA[ds].total),footer:`Mostrando ${DATA[ds].rows.length} de ${DATA[ds].rows.length}`,dim:dimmed?.42:1,bar,minRows:Math.max(nFrom,nTo)},cls:0};
}
function sReload(lt,d){
  const o=fade(lt,d,.5,.5);
  const cyc=7; const k=Math.floor(lt/cyc), u=lt-k*cyc;
  const from=k%2?'B':'A', to=k%2?'A':'B';
  const L=reloadVM('skel',u,from,to,k*.32), R=reloadVM('flk',u,from,to,0);
  let shifts='';
  // layout shift callouts for skeleton
  if(u>=1.2&&u<2.4) shifts+=`<div class="shift" style="left:${XL+540}px;top:${735}px;opacity:${clamp((u-1.2)*3)*clamp((2.4-u)*3)}">▼ la pantalla salta</div>`;
  if(u>=3.6&&u<4.8) shifts+=`<div class="shift" style="left:${XL+540}px;top:${690}px;opacity:${clamp((u-3.6)*3)*clamp((4.8-u)*3)}">▲ salta otra vez</div>`;
  const caps=[
   [0,1.2,'El usuario <b>cambia el filtro</b>…'],
   [1.2,3.6,'<span class="r">Skeleton borra lo que mirabas</span> y pinta cajas grises.<br><span class="g">Flickerless lo deja, atenuado.</span>'],
   [3.6,7,'Llegan los datos: <span class="r">salto de pantalla</span> vs. <span class="g">cero movimiento</span>']];
  const c=lt<7?capSeq(lt,caps):capSeq(lt-7,[[0,1.2,'Y en <b>cada</b> recarga: paginar, filtrar, cambiar el período…'],[1.2,3.6,'<span class="r">Skeleton: otro parpadeo. Otro salto.</span>'],[3.6,8,'<span class="g">Flickerless: 0.00 de CLS, siempre.</span>']]);
  return `<div class="scene" style="opacity:${o}">${pills(L.cls,0)}${appHTML(L.vm)}${appHTML(R.vm)}${cursors(u,.9)}${shifts}${c}</div>`;
}

// ---- fast response scene -------------------------------------------------------
function sFast(lt,d){
  const o=fade(lt,d,.5,.5);
  const click=2.4, req=3.0, resp=3.6, thr=3.72; // slow-mo x4: 150 ms real -> 0.6 s
  const loading=lt>=req&&lt<resp, ds=lt<resp?'A':'B';
  const filter=lt<2.6?DATA.A.filter:DATA.B.filter;
  const pulse=.7+.3*Math.sin(lt*10);
  const SK={x:XL,cls:'r',filter,ds,mode:loading?'skel':'real',nSkel:5,kpi:loading?'grey':money(DATA[ds].total),footer:loading?'grey':`Mostrando ${DATA[ds].rows.length} de ${DATA[ds].rows.length}`,pulse};
  const FL={x:XR,cls:'g',filter,ds,mode:'real',kpi:money(DATA[ds].total),footer:`Mostrando ${DATA[ds].rows.length} de ${DATA[ds].rows.length}`,minRows:4};
  const clsL=lt>=req?.18+(lt>=resp?.14:0):0;
  // timeline strip
  const ms=clamp((lt-req)/4*1000*1,0,0)+clamp((lt-req)*250,0,300); // 4x slow-mo => 250 ms real per slow second
  const x0=260,w=1400, px=(m)=>x0+w*m/300;
  const strip=`<div class="abs" style="left:0;right:0;top:772px;height:110px;opacity:${clamp((lt-.5)*2)}">
    <div class="abs" style="left:${x0}px;top:42px;width:${w}px;height:6px;border-radius:3px;background:var(--line)"></div>
    <div class="abs" style="left:${x0}px;top:42px;width:${w*ms/300}px;height:6px;border-radius:3px;background:var(--acc)"></div>
    <div class="abs" style="left:${px(150)-2}px;top:24px;width:4px;height:42px;background:var(--red)"></div>
    <div class="abs" style="left:${px(150)-160}px;top:-16px;width:320px;text-align:center;font-size:26px;font-weight:700;color:var(--red)">Respuesta: 150 ms</div>
    <div class="abs" style="left:${px(180)-2}px;top:24px;width:4px;height:42px;background:var(--grn)"></div>
    <div class="abs" style="left:${px(180)-150}px;top:66px;width:700px;white-space:nowrap;font-size:26px;font-weight:700;color:var(--grn)">Umbral anti-parpadeo: 180 ms</div>
    <div class="abs" style="left:${x0-110}px;top:24px;font-size:24px;color:var(--mut);font-weight:600">0 ms</div>
    <div class="abs" style="left:${x0+ w*ms/300-10}px;top:34px;width:22px;height:22px;border-radius:50%;background:#fff"></div>
  </div>`;
  const slow=`<div class="abs" style="left:760px;top:40px;width:400px;text-align:center;font-size:26px;font-weight:700;color:var(--acc);opacity:${clamp((lt-2.2)*3)*clamp((7-lt)*3)}">CÁMARA LENTA ×4</div>`;
  const caps=[[0,2.6,'Una respuesta <b>rápida</b>: apenas 150 ms.'],[2.6,5.6,'<span class="r">Skeleton: borra todo y pinta cajas grises.</span><br>Un parpadeo que el usuario sí nota.'],[5.6,9.5,'<span class="g">Flickerless espera 180 ms.</span><br>Si la respuesta llegó antes, no enseña nada.']];
  return `<div class="scene" style="opacity:${o}">${pills(clsL,0)}${slow}${appHTML(SK)}${appHTML(FL)}${cursors(lt,click)}${strip}${capSeq(lt,caps)}</div>`;
}

// ---- cold load scene -----------------------------------------------------------
function sCold(lt,d){
  const o=fade(lt,d,.5,.5);
  const arrive=6.0;
  const waiting=lt<arrive;
  const pulse=.55+.45*Math.sin(lt*8);
  const ds='A';
  const SK=waiting?{x:XL,cls:'r',filter:'Este mes',ds,mode:'skel',nSkel:5,kpi:money(0),footer:'0 registros',pulse}
                  :{x:XL,cls:'r',filter:'Este mes',ds,mode:'real',kpi:money(DATA.A.total),footer:`Mostrando 4 de 4`};
  const FL=waiting?{x:XR,cls:'g',filter:'Este mes',ds,mode:'shell',nShell:4,kpi:null,footer:'—'}
                  :{x:XR,cls:'g',filter:'Este mes',ds,mode:'real',kpi:money(DATA.A.total),footer:`Mostrando 4 de 4`,minRows:4};
  const clsL=lt>=arrive?.21:0;
  let calls='';
  const a=clamp((lt-2.2)*2)*clamp((arrive-.3-lt)*2);
  calls+=`<div class="call r" style="left:${XL+300}px;top:${290}px;opacity:${a}">$0.00 ← cifra falsa</div>`;
  calls+=`<div class="call r" style="left:${XL+440}px;top:${762}px;opacity:${a}">“0 registros” ← alarma falsa</div>`;
  calls+=`<div class="call g" style="left:${XR+300}px;top:${290}px;opacity:${a}">— = aún no se sabe</div>`;
  calls+=`<div class="call g" style="left:${XR+400}px;top:${706}px;opacity:${a}">estructura real, sin mentir</div>`;
  const caps=[[0,2.2,'<b>Primera carga</b>: todavía no hay nada que conservar.'],[2.2,6,'<span class="r">Skeleton muestra un cero y “0 registros”.</span><br><span class="g">Flickerless: “—”. Un dato desconocido nunca es un cero.</span>'],[6,10,'En una pantalla financiera, <span class="r">$0.00 no es un hueco: es una mentira.</span>']];
  return `<div class="scene" style="opacity:${o}">${pills(clsL,0)}${appHTML(SK)}${appHTML(FL)}${calls}${capSeq(lt,caps)}</div>`;
}

// ---- maintenance scene ---------------------------------------------------------
function miniTable(x,y,cols,kind,label,hl){
  const heads=['N.º','Cliente','Fecha','Total','IVA'].slice(0,cols);
  const row=(i)=>`<div class="mt">`+heads.map((h,j)=>{
    const isNew=cols>4&&j===4;
    let inner;
    if(kind==='real') inner=i===0?`<b style="color:var(--mut);font-size:17px;letter-spacing:.06em;font-size:20px">${h.toUpperCase()}</b>`:['F-104'+i,'Acme','12 mar','$4,820','16%'][j];
    else if(kind==='skel') inner=i===0?'':`<div class="gb" style="width:${60+((i+j)%3)*18}px;height:16px"></div>`;
    else inner=i===0?`<b style="color:var(--mut);font-size:17px;letter-spacing:.06em">${h.toUpperCase()}</b>`:`<span class="dash">—</span>`;
    return `<div class="mc" style="${isNew&&hl?'background:rgba(124,156,255,.18);border-radius:6px':''}">${inner}</div>`;
  }).join('')+`</div>`;
  return `<div class="abs" style="left:${x}px;top:${y}px;width:800px"><div style="font-size:24px;color:var(--mut);font-weight:700;margin-bottom:8px">${label}</div>${row(0)}${row(1)}${row(2)}</div>`;
}
function sMaint(lt,d){
  const o=fade(lt,d,.5,.5);
  const addCol=3.0, shellCol=4.2;
  const realCols=lt>=addCol?5:4;
  const skCols=4;
  const shCols=lt>=shellCol?5:4;
  const hl=lt>=addCol&&lt<addCol+1.5;
  const mism=lt>=addCol+.6;
  const fL=(x,y,t,s,bad)=>`<div class="file" style="left:${x}px;top:${y}px;${bad?'border-color:var(--red)':''}">${t}<small>${s}</small></div>`;
  const left=`
    ${fL(XL+20,200,'Facturas.vue','pantalla real')}
    ${fL(XL+440,200,'FacturasSkeleton.vue','maqueta gris · otro archivo',lt>=addCol+1.2)}
    ${lt>=addCol+1.2?`<div class="call r" style="left:${XL+440}px;top:166px;opacity:${clamp((lt-addCol-1.2)*3)}">¿alguien se acordó de actualizarla?</div>`:''}
    ${miniTable(XL+20,340,skCols,'skel','Maqueta (skeleton)',false)}
    ${miniTable(XL+20,585,realCols,'real','Pantalla real',hl)}
    ${mism?`<div class="call r" style="left:${XL+30}px;top:835px;opacity:${clamp((lt-addCol-.6)*3)}">Desfase: la maqueta ya no se parece a la pantalla</div>`:''}`;
  const right=`
    ${fL(XR+20,200,'Facturas.vue','la pantalla es su propia maqueta')}
    ${miniTable(XR+20,340,shCols,'shell','Carcasa (cols) → “—” reales',lt>=shellCol&&lt<shellCol+1.5)}
    ${miniTable(XR+20,585,realCols,'real','Pantalla real',hl)}
    ${lt>=shellCol+.6?`<div class="call g" style="left:${XR+30}px;top:835px;opacity:${clamp((lt-shellCol-.6)*3)}">Una prop (cols). Nada más que mantener.</div>`:''}`;
  const counter=(x,n,c)=>`<div class="abs" style="left:${x}px;top:100px;font-size:26px;font-weight:700;color:var(--mut)">Archivos a mantener por pantalla: <span class="tag ${c}">${n}</span></div>`;
  const caps=[[0,3,'Cada pantalla con skeleton tiene <b>dos</b> versiones que mantener.'],[3,6.2,'Producto pide una columna nueva: <b>IVA</b>.'],[6.2,10,'<span class="r">El skeleton se queda viejo.</span> <span class="g">En Flickerless la estructura real es la maqueta.</span>']];
  return `<div class="scene" style="opacity:${o}">
    <div class="pill r" style="left:${XL}px">SKELETON</div><div class="pill g" style="left:${XR}px">FLICKERLESS</div>
    <div class="abs" style="left:${XL+260}px;top:104px;opacity:0"></div>
    <div class="app r" style="left:${XL}px;top:170px;height:730px"></div><div class="app g" style="left:${XR}px;top:170px;height:730px"></div>
    ${left}${right}${capSeq(lt,caps)}</div>`;
}

// ---- scorecard -----------------------------------------------------------------
const ROWS=[
 ['Parpadeo','Flash gris en cada respuesta rápida','Umbral de 180 ms: nada si llega antes'],
 ['Saltos de pantalla (CLS)','La maqueta casi nunca mide lo mismo','0.00 — filas reales, altura congelada'],
 ['Datos falsos','$0.00 y “0 registros” mientras carga','“—” hasta tener un dato real'],
 ['Recargas','Pierdes lo que estabas mirando','Lo anterior se queda, atenuado'],
 ['Mantenimiento','Una maqueta por pantalla','El contenido real es su maqueta']
];
function sScore(lt,d){
  const o=fade(lt,d,.5,.6);
  let rows='';
  ROWS.forEach((r,i)=>{
    const t0=1.0+i*1.1, a=ease((lt-t0)/.5), b=ease((lt-t0-.45)/.5);
    rows+=`<div class="sr" style="opacity:${a};transform:translateX(${(1-a)*30}px)">
      <div class="lb">${r[0]}</div>
      <div class="a"><div class="ic x" style="transform:scale(${clamp(a*1.0)})"></div>${r[1]}</div>
      <div class="b" style="color:var(--txt);opacity:${b}"><div class="ic k" style="transform:scale(${b})"></div>${r[2]}</div></div>`;
  });
  const win=ease((lt-6.8)/.8);
  return `<div class="scene" style="opacity:${o}">
    <div class="abs" style="left:150px;right:150px;top:60px;height:80px;display:flex;font-size:30px;font-weight:800;letter-spacing:.06em">
      <div style="width:430px"></div><div style="width:600px;color:var(--red)">SKELETON</div><div style="width:600px;color:var(--grn)">FLICKERLESS</div></div>
    <div class="score">${rows}</div>
    ${capSeq(lt,[[0,6.6,'Cinco diferencias que el usuario <b>sí siente</b>.'],[6.6,9,'<span class="g">Para datos de negocio, Flickerless gana en cada una.</span>']])}</div>`;
}

// ---- outro ---------------------------------------------------------------------
function sOutro(lt,d){
  const o=fade(lt,d,.6,.8);
  const cards=[['FlickerlessSurface','Envuelve la zona de datos. Atenúa lo que ya había + barra de 2 px.'],['FlickerlessValue','Un dato que aún no existe se ve como “—”, nunca como cero.'],['FlickerlessTableShell','La carga en frío: filas reales con “—”, no cajas grises.']];
  const cs=cards.map((c,i)=>{const a=ease((lt-.6-i*.5)/.6);return `<div class="abs" style="left:${130+i*580}px;top:350px;width:540px;height:230px;border-radius:20px;background:var(--panel);border:2px solid rgba(47,209,139,.4);padding:30px;opacity:${a};transform:translateY(${(1-a)*30}px)"><div style="font-size:30px;font-weight:800;color:var(--grn);margin-bottom:14px">${c[0]}</div><div style="font-size:26px;color:var(--txt);line-height:1.35">${c[1]}</div></div>`}).join('');
  const t=ease((lt-.1)/.7), z=ease((lt-2.8)/.7);
  return `<div class="scene" style="opacity:${o}">
    <div class="abs" style="left:0;right:0;top:130px;text-align:center;opacity:${t}"><div style="font-size:110px;font-weight:900;letter-spacing:-.04em;color:var(--grn)">Flickerless</div>
    <div style="font-size:38px;font-weight:600;margin-top:14px">Lo que ya estaba <b style="color:var(--acc)">se queda</b>. Lo que aún no existe es <b style="color:var(--acc)">“—”</b>.</div></div>
    ${cs}
    <div class="abs" style="left:0;right:0;top:680px;text-align:center;opacity:${z}">
      <div style="display:inline-flex;gap:18px">${['Vue 3','React','React Native'].map(x=>`<span class="tag g" style="font-size:30px;padding:8px 26px">${x}</span>`).join('')}</div>
      <div style="font-size:30px;color:var(--mut);margin-top:34px">Pensado para tablas, gráficos y paneles de negocio · CRM · ERP · finanzas</div>
      <div style="font-size:30px;margin-top:18px;font-weight:700">github.com/LuisMTaveras/flickerless</div></div></div>`;
}

const FN={title:sTitle,reload:sReload,fast:sFast,cold:sCold,maint:sMaint,score:sScore,outro:sOutro};
window.TOTAL=TOTAL;
window.render=function(t){
  t=clamp(t,0,TOTAL-1e-6);
  let h='';
  for(const s of S){ if(t>=s.t0&&t<s.t0+s.d){ h=FN[s.id](t-s.t0,s.d); break; } }
  $('root').innerHTML=h;
};
render(0);
</script></body></html>
