name: Release
# Publica los cuatro paquetes en npm al empujar un tag vX.Y.Z (git tag v0.2.0 && git push origin v0.2.0).
# Requiere el secreto NPM_TOKEN (npmjs.com, el registro que usa pnpm → Access Tokens → Granular, con permiso de publicar en @flickerless).
on:
  push:
    tags: ['v*']
permissions:
  contents: read
  id-token: write # provenance: npm enlaza cada versión con este workflow
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          package-manager-cache: false # pnpm aún no existe aquí: lo activa corepack en el paso siguiente
          registry-url: https://registry.npmjs.org
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - name: El tag coincide con la versión de los paquetes
        run: |
          v="${GITHUB_REF_NAME#v}"
          for p in packages/*/package.json; do
            test "$(node -p "require('./$p').version")" = "$v" || { echo "$p no está en $v"; exit 1; }
          done
      - run: pnpm release --no-git-checks
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
