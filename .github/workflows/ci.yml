name: CI
on:
  push:
    branches: [master]
  pull_request:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          package-manager-cache: false # pnpm aún no existe aquí: lo activa corepack en el paso siguiente
      # pnpm sale de corepack con la versión de "packageManager" (sin acciones de terceros en Node 20).
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm smoke
      - run: pnpm --filter e2e exec playwright install --with-deps chromium
      - run: pnpm e2e
